name: Build APK

on:
  push:
    branches: [main, master, redesign/v1]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설치 (Android 빌드에 필요)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android 플랫폼 생성
        run: flutter create --platforms=android .

      - name: compileSdk/targetSdk를 36으로 상향
        run: |
          FILE_KTS=android/app/build.gradle.kts
          FILE_GROOVY=android/app/build.gradle
          if [ -f "$FILE_KTS" ]; then
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$FILE_KTS" || true
            sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$FILE_KTS" || true
          fi
          if [ -f "$FILE_GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$FILE_GROOVY" || true
            sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$FILE_GROOVY" || true
          fi

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: pub 패키지 캐시
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: 패키지 설치
        run: flutter pub get

      - name: DB 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 정적 분석
        run: flutter analyze --no-fatal-infos

      - name: 디버그 APK 빌드
        run: flutter build apk --debug

      - name: APK를 Actions 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: epub-reader-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

# verify redesigned/v1 after the reader interaction overhaul
